[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlbench-mini"
version = "0.1.0"
description = "Trusted-monitoring AI control harness with a hardened C++ sandbox"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "cmake>=3.16"]
claude = ["anthropic>=0.40"]

[project.scripts]
controlbench = "controlbench.cli:main"

[tool.setuptools.packages.find]
include = ["controlbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
